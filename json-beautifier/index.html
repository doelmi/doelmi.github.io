<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Beautifier</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-grid"></div>
    <div class="stars"></div>

    <div class="container">
        <header>
            <h1><span class="glow">JSON</span> <span class="glow-accent">Beautifier</span></h1>
            <p class="subtitle">Quantum JSON Formatter</p>
        </header>

        <main>
            <div class="controls-panel">
                <div class="control-group">
                    <label for="indentation">Indentation:</label>
                    <select id="indentation">
                        <option value="2">2 spaces</option>
                        <option value="4" selected>4 spaces</option>
                        <option value="8">8 spaces</option>
                        <option value="tab">Tab</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="fileInput">Load JSON:</label>
                    <input type="file" id="fileInput" accept=".json,.txt" />
                </div>
                <div class="button-group">
                    <button id="beautifyBtn" class="btn btn-primary">
                        <span class="btn-icon">⚡</span>Beautify
                    </button>
                    <button id="clearBtn" class="btn btn-secondary">
                        <span class="btn-icon">🗑</span>Clear
                    </button>
                    <button id="copyBtn" class="btn btn-secondary">
                        <span class="btn-icon">📋</span>Copy
                    </button>
                    <button id="downloadBtn" class="btn btn-secondary">
                        <span class="btn-icon">⬇️</span>Download
                    </button>
                </div>
            </div>

            <div class="content">
                <div class="input-section">
                    <label for="inputJson">
                        <span class="label-glow">◀</span> Input
                    </label>
                    <textarea id="inputJson" placeholder="Paste your JSON..." spellcheck="false"></textarea>
                </div>

                <div class="divider"></div>

                <div class="output-section">
                    <label for="outputJson">
                        Output <span class="label-glow">▶</span>
                    </label>
                    <textarea id="outputJson" placeholder="Formatted JSON will appear here..." readonly spellcheck="false"></textarea>
                </div>
            </div>

            <div id="message" class="message"></div>
        </main>
    </div>

    <script src="beautifier.js"></script>
</body>

</html>
